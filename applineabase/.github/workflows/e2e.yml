name: Pruebas de regresión (E2E)

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar y empaquetar (incluye los tests de Java)
        run: ./mvnw -B package

      - name: Arrancar la app en segundo plano
        run: |
          nohup java -jar target/applineabase-*.jar --server.port=8081 > app.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "Started Application" app.log && exit 0
            sleep 2
          done
          echo "La app no arrancó a tiempo:"
          cat app.log
          exit 1

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar dependencias de e2e/
        working-directory: e2e
        run: npm ci

      - name: Instalar navegador de Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Correr pruebas de regresión
        working-directory: e2e
        run: npx playwright test
        env:
          APP_BASE_URL: http://localhost:8081

      - name: Subir reporte de Playwright (solo si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Mostrar logs de la app (solo si algo falló)
        if: failure()
        run: cat app.log
