server.port=${PORT:8081}
logging.level.org.atmosphere=warn

# Base H2 en memoria, exclusiva para los tests: NUNCA la ruta real (C:\LineaBaseX\data), para
# que "mvn test"/"mvn package" no dependa de lo que ya haya en la base real de cada máquina
# (alarmas, usuarios, horómetro acumulados en producción) ni la modifique. Sin este archivo,
# los tests corrían contra la misma base real que usa la app en cada PC — pasaban en un entorno
# vacío pero fallaban en cualquier máquina con datos reales ya acumulados (por ejemplo, un test
# que espera "todavía no hay ninguna alarma" fallaba si ya había alarmas reales disparadas).
spring.datasource.url=jdbc:h2:mem:lineabase-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# Mismo motivo que la base de datos: una carpeta de test descartable (queda dentro de target/,
# "mvn clean" la borra), nunca la carpeta real de configuración de la máquina. Al no existir,
# ConfigLoaderService la siembra con los JSON por defecto de resources en cada corrida, siempre
# igual sin importar qué se haya configurado en la máquina real.
app.config.dir=target/test-lineabase-config

vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example

spring.jpa.hibernate.ddl-auto=update
logging.level.com.example.dataacquisition=DEBUG
vaadin.productionMode=true

# Mismo motivo que en el application.properties de main: schema.sql tiene ALTER TABLE que
# necesitan que Hibernate ya haya creado las tablas -- sin esto, en la base de test (embebida,
# Spring corre schema.sql automaticamente por defecto) el script se ejecuta primero contra una
# base vacia y falla con "Table ALARMA_CONFIG not found".
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
