server.port=${PORT:8080}

# Timeout de sesion general (rol USUARIO): 12h para no expulsar a un operador que deja
# el dashboard abierto sin interactuar durante un turno largo. El rol ADMIN queda acotado
# aparte a 1h de inactividad por AdminSessionTimeoutFilter (mayor riesgo de seguridad al
# poder editar config de alarmas y usuarios).
server.servlet.session.timeout=12h
logging.level.org.atmosphere=warn

# H2 persistente en archivo (usuarios, alarmas y horómetro) para no perderse al reiniciar.
# Ruta FIJA dentro de C:\LineaBaseX\data (misma carpeta raíz que ya usa la base de energía),
# en vez de una ruta relativa a donde se arranca el .jar — así empaquetar y reemplazar el
# .jar en un despliegue nuevo no se lleva la base con él. H2 crea la carpeta "data" sola si
# no existe. Se puede pisar con la variable de entorno DB_URL si hiciera falta otra ruta.
spring.datasource.url=${DB_URL:jdbc:h2:file:C:/LineaBaseX/data/lineabase;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver

# Carpeta externa (fuera del .jar) donde viven plc-config.json y linea-id-config.json.
# Es la misma carpeta C:\LineaBaseX donde ya se guardan las bases SQLite (BASE_PATH en
# DatabaseInitializationService) y la base H2 (./data, que en el servidor corre desde ahi).
# Se siembra automaticamente en el primer arranque con los JSON incluidos en resources.
app.config.dir=C:\\LineaBaseX\\config

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example

# Let Hibernate update the schema automatically or create it if it does not exist.
#
# DO NOT DO THIS IN PRODUCTION!
#
# Instead, use Flyway or another controlled way of managing your database schema.
# See https://vaadin.com/docs/latest/building-apps/forms-data/add-flyway for instructions.
spring.jpa.hibernate.ddl-auto=update
logging.level.com.example.dataacquisition=DEBUG
vaadin.productionMode=true

# Corre schema.sql (parches puntuales que ddl-auto=update no puede hacer solo, ver ese
# archivo) DESPUES de que Hibernate cree/actualice las tablas, no antes -- si no, en una
# instalacion nueva schema.sql fallaria porque las tablas todavia no existirian.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always