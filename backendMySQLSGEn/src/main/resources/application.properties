spring.application.name=backendMySQLSGEn
# 8080 es la app principal; este backend va en el 8081.
server.port=${PORT:8081}

# --- Lectura de equipos (solo lectura) ---
# true = lee PLC, pasarelas, mezcladores y generadores cada minuto. Mientras la app principal tambien lea, los equipos
# reciben dos lecturas por minuto.
colector.lectura.habilitada=true
# Segundo de cada minuto en que corre el ciclo.
colector.ciclo.segundo=30
# Donde se guardan las filas: memoria (hoy, no guarda) | mysql (cuando este lista).
colector.almacen=memoria

# Configuracion de equipos: la misma de la app principal (solo se lee).
app.config.dir=C:\\LineaBaseX\\config

# --- H2 de la app principal: solo para leer el catalogo de modelos de medidor ---
# AUTO_SERVER permite abrirla con la app corriendo. Usuario y clave vacios (ver F-02 de la app).
spring.datasource.url=jdbc:h2:file:C:/LineaBaseX/data/lineabase;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
# Nunca crear ni cambiar tablas de la H2 de la app.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
